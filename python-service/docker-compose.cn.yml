version: "3.8"

services:
  sulfur-predictor:
    build:
      context: ..
      dockerfile: python-service/Dockerfile.cn
    container_name: sulfur-predictor
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
