version: '3.8'

services:
  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    ports:
      - "3100:3100"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3100
      - API_BASE_URL=${API_BASE_URL}
      - API_KEY=${API_KEY}
      - INDUSTRY_CODE=${INDUSTRY_CODE:-sulfur}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
